apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tickup
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:gmottola00/Home-Lab-Infra.git
    targetRevision: main
    path: apps/tickup
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
