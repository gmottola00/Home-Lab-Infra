apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fiscoai
  namespace: argocd
  annotations:
    # Dopo postgres-base e qdrant (wave 1): database, ruolo e vector store dell'app.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: git@github.com:gmottola00/Home-Lab-Infra.git
    targetRevision: main
    path: apps/fiscoai
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
