# Mathesar (platform/mathesar/manifests): i dati dei database di pg-shared nel
# browser, con login Tailscale. Wave 2: dopo pg-shared e tsidp (wave 1).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mathesar
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: git@github.com:gmottola00/Home-Lab-Infra.git
    targetRevision: main
    path: platform/mathesar/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: mathesar
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
