apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:gmottola00/Home-Lab-Infra.git
    targetRevision: main
    path: apps/litellm
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
  # L'operator Tailscale riscrive externalName dell'egress verso il suo proxy:
  # senza questo selfHeal lo rimetterebbe a "placeholder" rompendo la rotta.
  ignoreDifferences:
    - kind: Service
      name: ollama-gpu
      namespace: litellm
      jsonPointers:
        - /spec/externalName
