apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: interview
  namespace: argocd
  annotations:
    # Dopo postgres-base: il database e il ruolo dell'app vivono lì.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: git@github.com:gmottola00/Home-Lab-Infra.git
    targetRevision: main
    path: apps/interview
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
