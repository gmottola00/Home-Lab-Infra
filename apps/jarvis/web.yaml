apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-web
  namespace: jarvis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jarvis-web
  template:
    metadata:
      labels:
        app: jarvis-web
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          image: ghcr.io/gmottola00/jarvis-web:latest
          env:
            # nginx inoltra /api qui. Il nome risolve via DNS del cluster
            # (jarvis-backend.jarvis.svc.cluster.local, abbreviato nel namespace).
            - name: BACKEND_UPSTREAM
              value: jarvis-backend:8000
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jarvis-web
  namespace: jarvis
spec:
  selector:
    app: jarvis-web
  ports:
    - port: 80
      targetPort: 80
