apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - backend.yaml
  - web.yaml
  - ingress.yaml
  # Encrypted with kubeseal — safe to commit; only the in-cluster controller
  # can decrypt them.
  - sealed-secret.yaml
  - ghcr-pull-secret.yaml
# Configurazione non segreta. Il generator aggiunge al nome un hash del
# contenuto (jarvis-config-<hash>) e aggiorna i riferimenti nel Deployment:
# un valore cambiato produce un pod template diverso, quindi un rollout. Una
# ConfigMap scritta a mano invece cambierebbe senza riavviare nessuno.
configMapGenerator:
  - name: jarvis-config
    namespace: jarvis
    literals:
      # ArgoCD gira con server.insecure: dall'interno si parla HTTP al Service,
      # senza passare dalla tailnet.
      - JARVIS_ARGOCD_BASE_URL=http://argocd-server.argocd.svc.cluster.local
      - JARVIS_LOG_JSON=true
      # Modelli via LiteLLM: ANTHROPIC_API_KEY in jarvis-secrets è la chiave
      # virtuale (make litellm-key APP=jarvis). Ollama è sondato solo per sapere
      # se il PC con la GPU è acceso.
      - JARVIS_LLM_GATEWAY_URL=http://litellm-proxy.litellm.svc.cluster.local:4000
      - JARVIS_OLLAMA_URL=http://ollama-gpu.litellm.svc.cluster.local:11434
# CI (Jarvis repo workflows) bumps newTag to the commit SHA on every push to
# main; ArgoCD picks up the commit and rolls out. Do not edit newTag by hand.
images:
  - name: ghcr.io/gmottola00/jarvis-backend
    newTag: 6746219573d581e8e82270fd556f7cff9ce80f87
  - name: ghcr.io/gmottola00/jarvis-web
    newTag: 2a2d3efbbf490cd7693f5b9a87b928eebdbbef7b
