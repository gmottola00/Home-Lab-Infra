# Broker MQTT del lab. Raggiungibile solo dentro il cluster (Service ClusterIP +
# NetworkPolicy), mai dalla tailnet.
listener 1883
allow_anonymous false
# Generato all'avvio dall'initContainer con mosquitto_passwd (utenti z2m e cli,
# password dal Secret iot-secrets).
password_file /mosquitto/auth/passwd

# I messaggi retained (stato delle prese) sopravvivono al riavvio del broker.
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

log_dest stdout
log_type error
log_type warning
log_type notice
