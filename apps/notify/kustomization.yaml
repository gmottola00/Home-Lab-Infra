apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - backend.yaml
  - networkpolicy.yaml
  # Encrypted with kubeseal — safe to commit; only the in-cluster controller
  # can decrypt them.
  # notify-secrets: NOTIFY_VAPID_PRIVATE_KEY (make notify-vapid)
  - sealed-secret.yaml
  # notify-db: DATABASE_URL verso pg-shared (make pg-user APP=notify)
  - db-sealed-secret.yaml
  # ghcr-pull: copiato da un altro namespace (make ghcr-pull APP=notify)
  - ghcr-pull-secret.yaml
configMapGenerator:
  - name: notify-config
    namespace: notify
    literals:
      # Claim `sub` del JWT VAPID: un contatto per i push service se qualcosa
      # va storto. mailto: o https:, Apple rifiuta placeholder e localhost.
      - NOTIFY_VAPID_SUBJECT=https://github.com/gmottola00
      # App ammesse: nome → sha256 del token. Gli hash non sono segreti; i token
      # stanno solo nei secret delle app. Lo aggiorna `make notify-token APP=...`.
      - NOTIFY_APPS={}
      - NOTIFY_LOG_JSON=true
# CI (repo Notify-Hub, ci.yml) bumps newTag to the commit SHA on every push to
# main; ArgoCD picks up the commit and rolls out. Do not edit newTag by hand.
images:
  - name: ghcr.io/gmottola00/notify-backend
    newTag: latest
