# Tailscale Operator ingress: device "interview" sulla tailnet con certificato
# Let's Encrypt → https://interview.<tailnet>.ts.net
# Nessun login nell'app: la tailnet è l'unico controllo d'accesso, come Jarvis.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: interview
  namespace: interview
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: interview-backend
      port:
        number: 8000
  tls:
    - hosts:
        - interview
