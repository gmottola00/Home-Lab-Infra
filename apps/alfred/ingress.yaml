# Tailscale Operator ingress: crea un device "alfred" sulla tailnet con
# certificato Let's Encrypt → https://alfred.<tailnet>.ts.net, raggiungibile
# anche dal telefono connesso alla tailnet.
# Tutto il traffico arriva al web; nginx serve il sito e inoltra /api.
# La tailnet è l'unico controllo d'accesso: le API di Alfred non hanno login.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alfred
  namespace: alfred
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: alfred-web
      port:
        number: 80
  tls:
    - hosts:
        - alfred
