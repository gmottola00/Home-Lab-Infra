apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - backend.yaml
  - web.yaml
  - ingress.yaml
  # Encrypted with kubeseal — safe to commit; only the in-cluster controller
  # can decrypt them.
  # alfred-secrets: ANTHROPIC_API_KEY (chiave virtuale LiteLLM, make litellm-rekey APP=alfred)
  - sealed-secret.yaml
  # alfred-db: DATABASE_URL verso pg-shared (make pg-user APP=alfred)
  - db-sealed-secret.yaml
  - ghcr-pull-secret.yaml
configMapGenerator:
  - name: alfred-config
    namespace: alfred
    literals:
      # Via LiteLLM: Claude passa dal pass-through Anthropic del gateway.
      - ALFRED_LLM_GATEWAY_URL=http://litellm-proxy.litellm.svc.cluster.local:4000
      - ALFRED_MODEL=claude-sonnet-5
      # Una sola chiamata per import, per le righe che le regole non coprono.
      - ALFRED_CATEGORIZER_MODEL=claude-haiku-4-5
      - ALFRED_TIMEZONE=Europe/Rome
      - ALFRED_LOG_JSON=true
# CI (Alfred repo workflows) bumps newTag to the commit SHA on every push to
# main; ArgoCD picks up the commit and rolls out. Do not edit newTag by hand.
images:
  - name: ghcr.io/gmottola00/alfred-backend
    newTag: 89fa5bcef11351d9bc1cd1109e9958daa92eeaaf
  - name: ghcr.io/gmottola00/alfred-web
    newTag: d9b298abe26182f8df30f0d4e0a8db99d313a4f1
