apiVersion: apps/v1
kind: Deployment
metadata:
  name: alfred-backend
  namespace: alfred
spec:
  # Una replica: la chat è di una persona sola, e il processo ricalcola le
  # ricorrenze dopo ogni import.
  replicas: 1
  # Niente RollingUpdate: due pod insieme lancerebbero le migrazioni Alembic in
  # parallelo sullo stesso database.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: alfred-backend
  template:
    metadata:
      labels:
        app: alfred-backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: backend
          image: ghcr.io/gmottola00/alfred-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            # Modello e gateway (configMapGenerator: un valore cambiato → rollout).
            - configMapRef:
                name: alfred-config
            # ANTHROPIC_API_KEY: chiave virtuale LiteLLM (make litellm-rekey APP=alfred).
            - secretRef:
                name: alfred-secrets
            # DATABASE_URL verso pg-shared (make pg-user APP=alfred). Postgres
            # rende durevoli anche checkpoint e approvazioni in sospeso.
            - secretRef:
                name: alfred-db
          # Le migrazioni girano nel lifespan prima che /health risponda: una
          # migrazione fallita = pod mai Ready, e il vecchio dato resta intatto.
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: alfred-backend
  namespace: alfred
spec:
  selector:
    app: alfred-backend
  ports:
    - port: 8000
      targetPort: 8000
