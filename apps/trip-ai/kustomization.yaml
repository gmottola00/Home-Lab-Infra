apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - backend.yaml
  - web.yaml
  - ingress.yaml
  # Encrypted with kubeseal — safe to commit; only the in-cluster controller
  # can decrypt them.
  - sealed-secret.yaml
  - ghcr-pull-secret.yaml
# CI (Trip-AI repo workflows) bumps newTag to the commit SHA on every push to
# main; ArgoCD picks up the commit and rolls out. Do not edit newTag by hand.
images:
  - name: ghcr.io/gmottola00/trip-ai-backend
    newTag: fe6cd36a8ac011eeb5e9467d1945e8a289e031a7
  - name: ghcr.io/gmottola00/trip-ai-web
    newTag: 131e8d2a969149901931553215b8460209b38f07
