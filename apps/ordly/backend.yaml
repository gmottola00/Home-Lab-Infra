apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordly-backend
  namespace: ordly
spec:
  # Una replica: poche attività, e lo stato dell'agente (checkpoint,
  # approvazioni in sospeso) sta già su Postgres.
  replicas: 1
  # Niente RollingUpdate: due pod insieme lancerebbero le migrazioni Alembic in
  # parallelo sullo stesso database.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ordly-backend
  template:
    metadata:
      labels:
        app: ordly-backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: backend
          image: ghcr.io/gmottola00/ordly-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            # Modello e gateway (configMapGenerator: un valore cambiato → rollout).
            - configMapRef:
                name: ordly-config
            # ANTHROPIC_API_KEY: chiave virtuale LiteLLM (make litellm-key APP=ordly → secret-add).
            - secretRef:
                name: ordly-secrets
            # DATABASE_URL verso pg-shared (make pg-user APP=ordly). Postgres
            # rende durevoli anche checkpoint e approvazioni in sospeso.
            - secretRef:
                name: ordly-db
          # Le migrazioni girano nel lifespan prima che /health risponda: una
          # migrazione fallita = pod mai Ready, e il vecchio dato resta intatto.
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ordly-backend
  namespace: ordly
spec:
  selector:
    app: ordly-backend
  ports:
    - port: 8000
      targetPort: 8000
