apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - backend.yaml
  - web.yaml
  - ingress.yaml
  # Encrypted with kubeseal — safe to commit; only the in-cluster controller
  # can decrypt them.
  # ordly-secrets: ANTHROPIC_API_KEY (chiave virtuale LiteLLM 'ordly')
  - sealed-secret.yaml
  # ordly-db: DATABASE_URL verso pg-shared (make pg-user APP=ordly)
  - db-sealed-secret.yaml
  - ghcr-pull-secret.yaml
configMapGenerator:
  - name: ordly-config
    namespace: ordly
    literals:
      # Via LiteLLM: Claude passa dal pass-through Anthropic del gateway.
      - ORDLY_LLM_GATEWAY_URL=http://litellm-proxy.litellm.svc.cluster.local:4000
      # I default di Ordly (claude-*-5-5) non sono nel gateway: modelli del lab.
      - ORDLY_MODEL=claude-sonnet-5
      # Parsing in blocco dei messaggi d'ordine, il modello economico.
      - ORDLY_PARSER_MODEL=claude-haiku-4-5
      - ORDLY_TIMEZONE=Europe/Rome
      - ORDLY_LOG_JSON=true
# CI (Ordly repo workflows) bumps newTag to the commit SHA on every push to
# main; ArgoCD picks up the commit and rolls out. Do not edit newTag by hand.
images:
  - name: ghcr.io/gmottola00/ordly-backend
    newTag: latest
  - name: ghcr.io/gmottola00/ordly-web
    newTag: latest
