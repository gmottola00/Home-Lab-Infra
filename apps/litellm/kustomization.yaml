apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - postgres.yaml
  - litellm.yaml
  - ollama-egress.yaml
  - ingress.yaml
  # Encrypted with kubeseal — safe to commit; only the in-cluster controller
  # can decrypt them. Keys: LITELLM_MASTER_KEY, LITELLM_SALT_KEY,
  # ANTHROPIC_API_KEY, POSTGRES_PASSWORD, DATABASE_URL.
  - sealed-secret.yaml

# config.yaml diventa la ConfigMap litellm-config-<hash>: cambiare un modello o
# un fallback produce un nome nuovo, quindi un rollout del proxy.
configMapGenerator:
  - name: litellm-config
    namespace: litellm
    files:
      - config.yaml
