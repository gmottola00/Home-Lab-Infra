# Helm values per il chart kube-prometheus-stack (repo: prometheus-community).
# Non si installa a mano: lo sincronizza ArgoCD — vedi bootstrap/apps/observability.yaml.
#
# Cosa entra nel cluster: Prometheus Operator, Prometheus, Alertmanager, Grafana,
# kube-state-metrics, node-exporter.

# --- k3s ---------------------------------------------------------------------
# Su k3s scheduler, controller-manager e proxy girano dentro l'unico processo k3s e
# bindano su 127.0.0.1; etcd non c'è (sqlite embedded). I job di scrape di default
# resterebbero down per sempre, con le relative alert sempre accese. Per esporli
# servirebbero flag in /etc/rancher/k3s/config.yaml sull'host — fuori da Git, e su un
# single-node dicono poco. Se un giorno servissero, si riaccendono qui.
kubeScheduler:         { enabled: false }
kubeControllerManager: { enabled: false }
kubeEtcd:              { enabled: false }
kubeProxy:             { enabled: false }

defaultRules:
  rules:
    # Spegniamo anche le regole di allarme dei componenti sopra: senza target, le loro
    # alert scattano a vuoto e insegnano a ignorare le notifiche.
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false
    etcd: false
    kubeProxy: false

# --- Prometheus --------------------------------------------------------------
prometheus:
  prometheusSpec:
    retention: 15d
    # Tetto duro sotto la dimensione della PVC: Prometheus scarta i blocchi vecchi da
    # solo invece di riempire il volume e andare in crash loop.
    retentionSize: 18GB

    # Di default il chart fa raccogliere a Prometheus solo i ServiceMonitor con la label
    # della propria release helm. Con questi a false raccoglie quelli di TUTTI i
    # namespace: è ciò che permette di scoprire ArgoCD (ns argocd) e le app che
    # esporranno /metrics in futuro, senza toccare questi values.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false

    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 3Gi

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 25Gi

# --- Alertmanager ------------------------------------------------------------
# Le allerte warning e critical arrivano sul telefono: webhook verso notify-hub
# (/v1/alertmanager), che le consegna ai dispositivi iscritti ad Alfred
# (NOTIFY_ALERT_ROUTES in apps/notify). Watchdog e info restano mute.
# Il volume serve solo a non perdere i silenzi ai restart.
alertmanager:
  config:
    # Le mappe si fondono con i default del chart (inhibit_rules, templates
    # restano); le liste qui sotto sostituiscono quelle di default.
    route:
      receiver: "null"
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      # Un'allerta ancora attiva si ripresenta due volte al giorno, non di più.
      repeat_interval: 12h
      routes:
        - receiver: "null"
          matchers: ['alertname = "Watchdog"']
        - receiver: phone
          matchers: ['severity =~ "warning|critical"']
    receivers:
      - name: "null"
      - name: phone
        webhook_configs:
          - url: http://notify-backend.notify.svc.cluster.local:8000/v1/alertmanager
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                # Secret alertmanager-notify (make notify-alerts-token), montato
                # dall'operator tramite alertmanagerSpec.secrets.
                credentials_file: /etc/alertmanager/secrets/alertmanager-notify/NOTIFY_TOKEN
  alertmanagerSpec:
    secrets: [alertmanager-notify]
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 2Gi

# --- Grafana -----------------------------------------------------------------
grafana:
  # Password in un SealedSecret (platform/observability/manifests/), mai nei values.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  # Client OIDC di tsidp (vedi auth.generic_oauth sotto).
  envFromSecret: grafana-oidc

  persistence:
    enabled: true
    storageClassName: local-path
    size: 5Gi

  grafana.ini:
    server:
      # Il TLS termina sull'ingress Tailscale e Grafana parla HTTP: senza root_url
      # esplicito genera redirect e link assoluti sbagliati (http://localhost:3000).
      root_url: https://grafana.tail682dc3.ts.net
    # Login automatico con l'identità Tailscale (tsidp, platform/tsidp): aprendo
    # Grafana si entra direttamente. Client ID e secret arrivano come variabili
    # GF_AUTH_GENERIC_OAUTH_* dal secret grafana-oidc (make oidc-client NAME=grafana).
    # Emergenza (tsidp giù): /login?disableAutoLogin=true → admin locale.
    auth.generic_oauth:
      enabled: true
      name: Tailscale
      auto_login: true
      allow_sign_up: true
      use_pkce: true
      scopes: openid email profile
      auth_url: https://idp.tail682dc3.ts.net/authorize
      token_url: https://idp.tail682dc3.ts.net/token
      api_url: https://idp.tail682dc3.ts.net/userinfo
      email_attribute_path: email
      login_attribute_path: preferred_username
      name_attribute_path: name
      # Il ruolo lo decide la policy della tailnet: extraClaims del grant tsidp
      # (grafana_role: Admin per gli admin). Tutti gli altri membri: Viewer.
      role_attribute_path: grafana_role || 'Viewer'

  # Stesso pattern di apps/*/ingress.yaml: device tailnet "grafana" con cert Let's
  # Encrypt → https://grafana.tail682dc3.ts.net
  ingress:
    enabled: true
    ingressClassName: tailscale
    tls:
      - hosts: [grafana]

  # Il datasource Prometheus lo cabla il chart da solo; Loki va aggiunto qui.
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      jsonData:
        maxLines: 1000

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
