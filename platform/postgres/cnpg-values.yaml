# Values del chart cloudnative-pg (l'operator). Il Postgres vero e proprio è in
# manifests/cluster.yaml.

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

# Metriche dell'operator (reconcile, errori). Prometheus seleziona tutti i
# PodMonitor del cluster, senza bisogno di label particolari.
monitoring:
  podMonitorEnabled: true

# Dashboard Grafana ufficiale di CloudNativePG (chart grafana-dashboards, come
# dipendenza dell'operator): una ConfigMap con la label grafana_dashboard, che
# la sidecar di Grafana carica da qualunque namespace. Il JSON pesa ~250 KB, al
# limite dell'apply classico: sta qui perché cnpg-operator usa ServerSideApply.
  grafanaDashboard:
    create: true
