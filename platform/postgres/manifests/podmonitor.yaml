# Metriche di Postgres (exporter integrato nelle istanze, porta "metrics").
# Scritto a mano: spec.monitoring.enablePodMonitor del Cluster è deprecato.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pg-shared
  namespace: databases
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: pg-shared
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
