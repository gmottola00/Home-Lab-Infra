# Database di Ordly (ordini per attività alimentari). Lo schema lo crea l'app (Alembic all'avvio).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: pg-shared-ordly
  namespace: databases
spec:
  cluster:
    name: pg-shared
  name: ordly
  owner: ordly
  # Default esplicito: togliere questo CR non fa DROP DATABASE.
  databaseReclaimPolicy: retain
