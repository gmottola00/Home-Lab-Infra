apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - cluster.yaml
  - podmonitor.yaml
  - backup.yaml
  # Un Database CR per app. Stanno nel namespace del Cluster, non in quello
  # dell'app: l'operator li cerca lì.
  - databases/interview.yaml
  - databases/alfred.yaml
  - databases/notify.yaml
  - databases/fiscoai.yaml
  # Password dei ruoli (basic-auth, sigillate da `make pg-user APP=...`).
  - roles/interview-sealed.yaml
  - roles/alfred-sealed.yaml
  - roles/notify-sealed.yaml
  - roles/fiscoai-sealed.yaml
